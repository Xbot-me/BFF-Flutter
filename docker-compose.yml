version: '3.8'

services:
  bff:
    image: ghcr.io/xbot-me/bff-flutter:latest
    build: .
    container_name: kpop-bff
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - API_SOURCE=MOCK # Change to SHOPIFY in production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/tenant-config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
