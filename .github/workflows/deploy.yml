name: Build & Deploy BFF (Self-Hosted Runner + GHCR)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ── Step 1: Cloud Builder (Builds & caches image on GitHub's fast runners) ──
  build-and-push:
    name: Build & Push Container to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        id: repo-name
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/bff-flutter" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo-name.outputs.IMAGE }}:latest
            ${{ steps.repo-name.outputs.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 2: Self-Hosted Deployer (Runs directly inside your server via outbound HTTPS) ──
  deploy:
    name: Deploy on Server via Self-Hosted Runner
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull & Deploy Latest Container
        run: |
          echo "🚀 Starting deployment via self-hosted runner on server..."
          
          # Navigate to repository directory on the host server
          cd "$HOME/BFF-Flutter" || cd "/root/BFF-Flutter" || cd "/home/$USER/BFF-Flutter" || cd "$(dirname "$PWD")/BFF-Flutter"
          
          # Pull pre-built image and restart container (supports both root and non-root docker)
          if docker compose version >/dev/null 2>&1; then
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          else
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
          fi
          
          echo "✅ Self-hosted deployment completed successfully!"
