name: Build & Deploy BFF (Secure Cloud Runner + GHCR)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ── Step 1: Cloud Builder (Isolated GitHub Runner) ──
  build-and-push:
    name: Build & Push Container to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        id: repo-name
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/bff-flutter" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo-name.outputs.IMAGE }}:latest
            ${{ steps.repo-name.outputs.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 2: Secure Pull-Only Deployment via SSH (Isolated User) ──
  deploy:
    name: Deploy to Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Execute Pull & Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Starting secure container pull & deploy on server..."
            cd ~/BFF-Flutter || cd /root/BFF-Flutter || cd /home/${{ secrets.SERVER_USER }}/BFF-Flutter
            
            # Pull pre-built container layers from GHCR (supports both root and non-root docker)
            if docker compose version >/dev/null 2>&1; then
              docker compose pull
              docker compose up -d --remove-orphans
              docker image prune -f
            else
              sudo docker compose pull
              sudo docker compose up -d --remove-orphans
              sudo docker image prune -f
            fi
            
            echo "✅ Container deployed and live!"
